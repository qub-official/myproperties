<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; media-src 'self' file:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
  <title>MyProperties wallpaper</title>
  <style>
    @font-face { font-family: 'Pretendard'; src: url('../../node_modules/pretendard/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2'); font-weight: 45 920; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0C0F14; cursor: none; }
    #stage, #stage > * { position: absolute; inset: 0; width: 100%; height: 100%; }
    video, img { display: block; }
    .fit-cover { object-fit: cover; }
    .fit-contain { object-fit: contain; }
    .fit-stretch { object-fit: fill; }
    .fit-center { object-fit: none; }
    #dim { position: absolute; inset: 0; background: #0C0F14; opacity: 0; pointer-events: none; }
    #clock { position: absolute; color: #fff; font-family: 'Pretendard', 'Segoe UI', sans-serif; text-shadow: 0 2px 24px rgba(12, 15, 20, .25); display: none; }
    #clock.center { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #clock.corner { left: 6vw; bottom: 12vh; display: flex; flex-direction: column; }
    #clock.corner .time { font-size: clamp(48px, 6vw, 110px); }
    #clock .time { font-size: clamp(64px, 10vw, 180px); font-weight: 250; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
    #clock .date { font-size: clamp(16px, 1.6vw, 28px); font-weight: 500; margin-top: 12px; letter-spacing: .02em; }
    #clock .kr { opacity: .75; margin-left: .5em; }
    #clock.on-light { color: #0C0F14; text-shadow: none; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="dim"></div>
  <div id="clock"><div class="time">00:00</div><div class="date"></div></div>
  <script src="scenes.js"></script>
  <script src="wallpaper.js"></script>
</body>
</html>
